name: CI

# Runs on every push and every pull request. This is the enforcement layer for
# the "must pass before merge" rules in CLAUDE.md. Before this workflow
# existed, they depended on someone remembering to run them locally.
#
# Branch protection on main is ENABLED, so a red run here blocks the merge.
# The required status check is matched by JOB NAME, currently "Typecheck,
# lint, build". Adding a step to that job is covered automatically. Renaming
# the job silently detaches the branch rule and merges stop being blocked with
# nothing looking wrong, so rename and update the rule together or not at all.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any older run for the same branch/PR when a new commit lands,
# so CI doesn't queue up stale runs on a fast-moving branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # The rules in CLAUDE.md that typecheck, lint and build cannot see.
      # Added 2026-08-04, after an audit found that every bug in the repo,
      # including two that destroyed user data, passed the three steps above.
      # Known violations are listed in scripts/conventions-baseline.json, so
      # this blocks new ones without needing the backlog cleared first.
      - name: Check conventions
        run: pnpm check:conventions

      # Pinned to a non-UTC zone on purpose. GitHub runners all run on UTC, and
      # a timezone bug is invisible there: the daylight-saving regression fixed
      # in REE-52 left tests/unit/calendar-zone.test.ts's "ignores a DST change
      # that belongs to the browser" assertion passing even with the getDstOffset
      # override removed, because under UTC the browser fallback is always zero.
      # Europe/London is the zone that makes it bite: London springs forward
      # between that test's two Auckland instants, so a removed override fails it.
      # Without a fixed TZ here the calendar's timezone protection only exists on
      # whichever laptop happens to be in the right zone.
      - name: Unit tests
        run: pnpm test
        env:
          TZ: Europe/London

      - name: Build
        run: pnpm build
        env:
          # next build only needs these to complete a production build, it
          # does not need working Supabase/Stripe/Resend/etc credentials:
          # none of Reeve's routes call out to those services during the
          # build step itself (no generateStaticParams that hits Supabase,
          # no build-time data fetching). If a future page adds real
          # build-time fetching against an external service, add the real
          # secret via repo Settings > Secrets and reference it here instead
          # of a placeholder.
          NEXT_PUBLIC_APP_URL: https://reeve.example.com
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-role-key' }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY || 'pk_test_placeholder' }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY || '' }}

  # Integration tests need a real Postgres and PostgREST, because the bugs they
  # exist to catch (partial writes nulling columns, PostgREST embed semantics)
  # do not reproduce against a mock. That needs Docker, which the Ubuntu runner
  # has and Matt's machine does not, so this is the only place they run.
  # See tests/README.md.
  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Both jobs pin the Node version Vercel builds production on. Keep them
      # in step: CI verifying a different runtime than the one that deploys is
      # the drift this workflow exists to prevent.
      #
      # There is also a hard floor here. supabase-js constructs a RealtimeClient
      # on creation, which needs a global WebSocket, and that only exists
      # natively from Node 22. Below that the integration tests fail on client
      # construction before a single assertion runs.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pinned, for the same reason the Node version above is. `latest` makes
      # the action resolve the newest release through the GitHub API on every
      # run, unauthenticated, which shares a 60 per hour limit across runners.
      # This job and the e2e job start together and request it at the same
      # moment, so one of the two intermittently fails at setup having never
      # run a test. It also means the CLI applying the migrations, and so the
      # schema every integration test runs against, can change with no commit.
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.2

      # Applies every migration in supabase/migrations from scratch, so the
      # schema under test is the committed schema and nothing else.
      #
      # Only the containers a test can actually reach. This was 93 seconds of a
      # 146 second job, most of it pulling and health-checking services nothing
      # here touches. What is left is postgres, kong, postgrest, gotrue and
      # storage-api: the database, the gateway the API_URL points at, the two
      # APIs every test goes through, and the service two migrations reference.
      #
      # The excluded five are all verified unused rather than assumed: there is
      # no supabase/functions directory (edge-runtime), no .channel() call
      # anywhere in the repo (realtime), auth.enable_confirmations is false so
      # no test sends mail (mailpit), db.pooler is already disabled (supavisor),
      # and imgproxy plus postgres-meta exist to serve Studio, which is also
      # excluded. logflare and vector are off via [analytics] in config.toml,
      # for the reason given there.
      #
      # Keep this list identical in both jobs, for the same reason the CLI
      # version is pinned to one value in both: two stacks would mean a test
      # could pass one suite and fail the other with nothing in the diff saying
      # why. If one of these turns out to be needed, the container is simply
      # absent and the failure names it, which is loud rather than silent.
      - name: Start Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,mailpit,postgres-meta,realtime,supavisor

      # The local stack's keys are generated by the CLI, not secrets. Read them
      # from status rather than hardcoding, so a CLI version that rotates them
      # does not silently break this job.
      - name: Export local Supabase credentials
        run: |
          supabase status -o json > /tmp/supabase-status.json
          echo "SUPABASE_TEST_URL=$(jq -r '.API_URL' /tmp/supabase-status.json)" >> "$GITHUB_ENV"
          echo "SUPABASE_TEST_SERVICE_ROLE_KEY=$(jq -r '.SERVICE_ROLE_KEY' /tmp/supabase-status.json)" >> "$GITHUB_ENV"

      - name: Integration tests
        run: pnpm test:integration

  # End-to-end tests. The layer above the integration suite: a real browser
  # loading real pages out of a real production build against a real database.
  #
  # It exists because nothing else in this workflow loads a page a TM opens.
  # next build prerenders six routes and not one of them is under app/(app),
  # since the (app) layout reads cookies() and everything below it is dynamic.
  # So a Server Component that throws on the schedule, the roster or a planner
  # passes every step of the build job and then serves a 500 to the only person
  # using the product.
  #
  # Same Docker-only constraint as the integration job, so this is CI-only too.
  # See tests/README.md.
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Node 24, matching the other jobs and Vercel. Same hard floor as the
      # integration job: supabase-js needs a global WebSocket, which arrives in
      # Node 22.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same pin as the integration job, and it has to stay the same value.
      # Two CLI versions across the two jobs would mean two schemas, so a
      # migration could pass one suite and fail the other for no visible reason.
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.2

      # Same exclusion list as the integration job, and it has to stay the same
      # value, for the same reason the CLI version above does. The reasoning for
      # each excluded container is documented on that job's step.
      - name: Start Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,mailpit,postgres-meta,realtime,supavisor

      # Read the generated keys rather than hardcoding them, same as the
      # integration job. SUPABASE_TEST_* are what tests/integration/fixture.ts
      # reads when the e2e seed runs; the other three are what the app itself
      # reads, at build time and at run time.
      - name: Export local Supabase credentials
        run: |
          supabase status -o json > /tmp/supabase-status.json
          API_URL="$(jq -r '.API_URL' /tmp/supabase-status.json)"
          ANON_KEY="$(jq -r '.ANON_KEY' /tmp/supabase-status.json)"
          SERVICE_ROLE_KEY="$(jq -r '.SERVICE_ROLE_KEY' /tmp/supabase-status.json)"
          {
            echo "SUPABASE_TEST_URL=$API_URL"
            echo "SUPABASE_TEST_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      # Deliberately not the placeholder values the build job uses.
      # NEXT_PUBLIC_* is inlined at build time, so a placeholder produces an app
      # that renders perfectly and cannot reach the database, and every spec
      # then fails for the wrong reason.
      - name: Build against the local Supabase
        run: pnpm build
        env:
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

      # Keyed on the Playwright version, because the browser build is pinned to
      # it: a version bump has to miss the cache or the run gets a browser the
      # library refuses to drive.
      - name: Read the Playwright version
        run: |
          echo "PLAYWRIGHT_VERSION=$(node -p "require('./package.json').devDependencies['@playwright/test'].replace(/^[^0-9]*/, '')")" >> "$GITHUB_ENV"

      - name: Restore the browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      # --only-shell installs chromium-headless-shell rather than full Chromium:
      # a much smaller download, and what a headless run uses anyway.
      #
      # Deliberately no --with-deps and no install-deps. That is an apt install
      # needing sudo, it cannot be cached because the packages land outside
      # ~/.cache/ms-playwright, and it was taking longer than everything else in
      # this job put together. The ubuntu-latest image already ships the
      # libraries headless Chromium needs. If that stops being true, the browser
      # fails to launch with a message naming the missing library, which is a
      # loud failure rather than a slow one, and the fix is to add it back.
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --only-shell chromium

      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          # Absent secret means the dev login route returns 404 and no spec can
          # sign in. Add it in Settings, Secrets and variables, Actions.
          E2E_LOGIN_SECRET: ${{ secrets.E2E_LOGIN_SECRET }}

      # Only on failure: the log line names the spec, and this is for the
      # detail behind it (trace, screenshot) without needing Docker locally.
      # Both paths, deliberately. playwright-report is the readable summary;
      # test-results holds the trace and the error-context snapshot for each
      # failure, which is the only way to see what the page actually contained
      # without a local Docker. Debugging a failure from the log alone cost a
      # long detour on this brief.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # Deploys the jobs in trigger/jobs to Trigger.dev, on merge to main only.
  #
  # This job exists because the two runtimes deploying separately caused a silent
  # production failure on 2026-08-04. Vercel redeploys on merge; Trigger.dev did
  # not, because it had no CI step and no package.json script. So when Brief 36
  # step 3 dropped shows.load_in_at and shows.curfew_at, Vercel shipped the code
  # that stopped reading them and Trigger.dev kept running the code that did.
  # /itinerary runs ONLY on Trigger.dev (lib/comms/router.ts is reached from
  # trigger/jobs/*-router.ts and from nothing on Vercel), so every inbound
  # /itinerary hit a 42703 on two dropped columns and told the crew member the
  # tour had no shows. Vercel's logs were clean throughout.
  #
  # CLAUDE.md documents the ordering rule that would have prevented it. This job
  # is the reason nobody has to remember it: both runtimes now ship from the same
  # merge, so the code cannot skew between them in the first place.
  #
  # needs: [build, integration, e2e] deliberately. A deploy that races the tests
  # would put unverified job code in front of real crew.
  deploy-trigger:
    name: Deploy Trigger.dev jobs
    runs-on: ubuntu-latest
    needs: [build, integration, e2e]
    # Merges only. A pull request must never deploy: it would put a branch's job
    # code into the same Trigger.dev environment that production runs from.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Same Node version as the other two jobs and as Vercel. trigger.config.ts
      # pins the jobs' own runtime to node-22 separately; this is just the CLI.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails the job if the secret is absent rather than letting the deploy
      # command fail with something less obvious. A missing token here means the
      # runtimes are silently back to deploying separately, which is the exact
      # state this job exists to prevent, so it has to be loud.
      - name: Check the Trigger.dev token is present
        run: |
          if [ -z "${{ secrets.TRIGGER_ACCESS_TOKEN }}" ]; then
            echo "TRIGGER_ACCESS_TOKEN is not set in repository secrets."
            echo "Without it the Trigger.dev jobs do not deploy on merge, and any"
            echo "migration that drops a column will break them silently."
            exit 1
          fi

      # The CLI version is read from the installed SDK rather than pinned here or
      # left as @latest.
      #
      # Trigger.dev expects the CLI and the SDK to be the same version. @latest
      # would drift the moment they publish a major, and it would drift silently:
      # a deploy that stops working puts the two runtimes back to shipping
      # separately, which is the exact failure this job exists to prevent, and
      # nothing else in CI would notice. Deriving it from package.json means
      # bumping the SDK cannot leave the CLI behind.
      - name: Deploy
        run: |
          CLI_VERSION="$(node -p "require('./package.json').dependencies['@trigger.dev/sdk'].replace(/^[^0-9]*/, '')")"
          echo "Deploying with trigger.dev CLI $CLI_VERSION (matched to the installed SDK)"
          npx "trigger.dev@$CLI_VERSION" deploy
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
