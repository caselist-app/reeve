name: CI

# Runs on every push and every pull request. This is the enforcement layer for
# the "must pass before merge" rules in CLAUDE.md. Before this workflow
# existed, they depended on someone remembering to run them locally.
#
# Branch protection on main is ENABLED, so a red run here blocks the merge.
# The required status check is matched by JOB NAME, currently "Typecheck,
# lint, build". Adding a step to that job is covered automatically. Renaming
# the job silently detaches the branch rule and merges stop being blocked with
# nothing looking wrong, so rename and update the rule together or not at all.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any older run for the same branch/PR when a new commit lands,
# so CI doesn't queue up stale runs on a fast-moving branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # The rules in CLAUDE.md that typecheck, lint and build cannot see.
      # Added 2026-08-04, after an audit found that every bug in the repo,
      # including two that destroyed user data, passed the three steps above.
      # Known violations are listed in scripts/conventions-baseline.json, so
      # this blocks new ones without needing the backlog cleared first.
      - name: Check conventions
        run: pnpm check:conventions

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # next build only needs these to complete a production build, it
          # does not need working Supabase/Stripe/Resend/etc credentials:
          # none of Reeve's routes call out to those services during the
          # build step itself (no generateStaticParams that hits Supabase,
          # no build-time data fetching). If a future page adds real
          # build-time fetching against an external service, add the real
          # secret via repo Settings > Secrets and reference it here instead
          # of a placeholder.
          NEXT_PUBLIC_APP_URL: https://reeve.example.com
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-role-key' }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY || 'pk_test_placeholder' }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY || '' }}

  # Integration tests need a real Postgres and PostgREST, because the bugs they
  # exist to catch (partial writes nulling columns, PostgREST embed semantics)
  # do not reproduce against a mock. That needs Docker, which the Ubuntu runner
  # has and Matt's machine does not, so this is the only place they run.
  # See tests/README.md.
  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Both jobs pin the Node version Vercel builds production on. Keep them
      # in step: CI verifying a different runtime than the one that deploys is
      # the drift this workflow exists to prevent.
      #
      # There is also a hard floor here. supabase-js constructs a RealtimeClient
      # on creation, which needs a global WebSocket, and that only exists
      # natively from Node 22. Below that the integration tests fail on client
      # construction before a single assertion runs.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Applies every migration in supabase/migrations from scratch, so the
      # schema under test is the committed schema and nothing else.
      - name: Start Supabase
        run: supabase start

      # The local stack's keys are generated by the CLI, not secrets. Read them
      # from status rather than hardcoding, so a CLI version that rotates them
      # does not silently break this job.
      - name: Export local Supabase credentials
        run: |
          supabase status -o json > /tmp/supabase-status.json
          echo "SUPABASE_TEST_URL=$(jq -r '.API_URL' /tmp/supabase-status.json)" >> "$GITHUB_ENV"
          echo "SUPABASE_TEST_SERVICE_ROLE_KEY=$(jq -r '.SERVICE_ROLE_KEY' /tmp/supabase-status.json)" >> "$GITHUB_ENV"

      - name: Integration tests
        run: pnpm test:integration

  # Deploys the jobs in trigger/jobs to Trigger.dev, on merge to main only.
  #
  # This job exists because the two runtimes deploying separately caused a silent
  # production failure on 2026-08-04. Vercel redeploys on merge; Trigger.dev did
  # not, because it had no CI step and no package.json script. So when Brief 36
  # step 3 dropped shows.load_in_at and shows.curfew_at, Vercel shipped the code
  # that stopped reading them and Trigger.dev kept running the code that did.
  # /itinerary runs ONLY on Trigger.dev (lib/comms/router.ts is reached from
  # trigger/jobs/*-router.ts and from nothing on Vercel), so every inbound
  # /itinerary hit a 42703 on two dropped columns and told the crew member the
  # tour had no shows. Vercel's logs were clean throughout.
  #
  # CLAUDE.md documents the ordering rule that would have prevented it. This job
  # is the reason nobody has to remember it: both runtimes now ship from the same
  # merge, so the code cannot skew between them in the first place.
  #
  # needs: [build, integration] deliberately. A deploy that races the tests would
  # put unverified job code in front of real crew.
  deploy-trigger:
    name: Deploy Trigger.dev jobs
    runs-on: ubuntu-latest
    needs: [build, integration]
    # Merges only. A pull request must never deploy: it would put a branch's job
    # code into the same Trigger.dev environment that production runs from.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Same Node version as the other two jobs and as Vercel. trigger.config.ts
      # pins the jobs' own runtime to node-22 separately; this is just the CLI.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails the job if the secret is absent rather than letting the deploy
      # command fail with something less obvious. A missing token here means the
      # runtimes are silently back to deploying separately, which is the exact
      # state this job exists to prevent, so it has to be loud.
      - name: Check the Trigger.dev token is present
        run: |
          if [ -z "${{ secrets.TRIGGER_ACCESS_TOKEN }}" ]; then
            echo "TRIGGER_ACCESS_TOKEN is not set in repository secrets."
            echo "Without it the Trigger.dev jobs do not deploy on merge, and any"
            echo "migration that drops a column will break them silently."
            exit 1
          fi

      # The CLI version is read from the installed SDK rather than pinned here or
      # left as @latest.
      #
      # Trigger.dev expects the CLI and the SDK to be the same version. @latest
      # would drift the moment they publish a major, and it would drift silently:
      # a deploy that stops working puts the two runtimes back to shipping
      # separately, which is the exact failure this job exists to prevent, and
      # nothing else in CI would notice. Deriving it from package.json means
      # bumping the SDK cannot leave the CLI behind.
      - name: Deploy
        run: |
          CLI_VERSION="$(node -p "require('./package.json').dependencies['@trigger.dev/sdk'].replace(/^[^0-9]*/, '')")"
          echo "Deploying with trigger.dev CLI $CLI_VERSION (matched to the installed SDK)"
          npx "trigger.dev@$CLI_VERSION" deploy
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
